[project]
name = "astrorabbit"
version = "0.1.0"
description = "Flow Debugger backend"
authors = [
    { name = "bnuuy", email = "kiddolol39@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "nanoid>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "astrorabbit.main:app"

[tool.uv]
link-mode = "copy"
